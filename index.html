<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayisha Hiba & Muhammed Salah | Nikah Invitation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Georgia',serif;
}

body{
    background:#fffaf2;
    color:#4b3621;
    text-align:center;
}

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    background:
    linear-gradient(rgba(255,250,242,.85),rgba(255,250,242,.9)),
    url("https://images.unsplash.com/photo-1519741497674-611481863552");
    background-size:cover;
}

.card{
    background:white;
    padding:45px 25px;
    border-radius:25px;
    box-shadow:0 10px 35px #d8c29b;
    max-width:500px;
}

h1{
    font-size:42px;
    color:#b8860b;
}

.and{
    font-size:28px;
    margin:15px;
}

.subtitle{
    font-size:20px;
    margin:20px 0;
}

.gold{
    color:#b8860b;
    font-weight:bold;
}

.section{
    padding:50px 20px;
}

.box{
    background:white;
    margin:20px auto;
    padding:25px;
    border-radius:20px;
    max-width:500px;
    box-shadow:0 5px 20px #ead9b5;
}

button{
    background:#b8860b;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:30px;
    font-size:16px;
    margin-top:20px;
}

#countdown{
    font-size:25px;
    color:#b8860b;
    margin-top:20px;
}

footer{
    padding:25px;
    background:#b8860b;
    color:white;
}
</style>
</head>

<body>

<section class="hero">
<div class="card">

<p class="subtitle">Together with their families</p>

<h1>Ayisha Hiba</h1>
<div class="and">&</div>
<h1>Muhammed Salah</h1>

<p class="subtitle">
Invite you to celebrate their<br>
<span class="gold">Nikah Ceremony</span>
</p>

<p>
16 August 2026<br>
11:00 AM
</p>

<div id="countdown"></div>

</div>
</section>


<section class="section">

<div class="box">
<h2>💍 Nikah Details</h2>
<br>
<p>
Date: 16 August 2026<br>
Time: 11:00 AM
</p>
</div>


<div class="box">
<h2>📍 Venue</h2>
<br>
<p>
LUXOTICA INTERNATIONAL<br>
CONVENTION CENTRE
</p>

<button onclick="window.open('https://maps.google.com')">
Open Location
</button>

</div>

</section>


<footer>
With love & blessings ❤️
</footer>


<script>

let weddingDate = new Date("August 16, 2026 11:00:00").getTime();

setInterval(function(){

let now = new Date().getTime();
let distance = weddingDate-now;

let days=Math.floor(distance/(1000*60*60*24));
let hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
let minutes=Math.floor((distance%(1000*60*60))/(1000*60));
let seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("countdown").innerHTML =
days+" Days "+hours+" Hours "+minutes+" Minutes "+seconds+" Seconds";

},1000);

</script>

</body>
</html>
