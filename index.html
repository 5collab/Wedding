<script>


let weddingDate =

new Date("August 16, 2026 11:00:00").getTime();



let timer = setInterval(function(){


let now = new Date().getTime();


let distance = weddingDate - now;



if(distance < 0){

document.getElementById("countdown").innerHTML =
"Alhamdulillah ❤️ The Day Has Arrived";

clearInterval(timer);

return;

}



let days =
Math.floor(distance/(1000*60*60*24));



let hours =
Math.floor(
(distance%(1000*60*60*24))/(1000*60*60)
);



let minutes =
Math.floor(
(distance%(1000*60*60))/(1000*60)
);



let seconds =
Math.floor(
(distance%(1000*60))/1000
);



document.getElementById("countdown").innerHTML =

days+" Days "
+hours+" Hours "
+minutes+" Minutes "
+seconds+" Seconds";



},1000);





function openMap(){


window.open(

"https://maps.google.com/?q=LUXOTICA+INTERNATIONAL+CONVENTION+CENTRE"

);


}





function rsvp(){


let msg =

"Assalamu Alaikum 😊\n\nI would like to attend the Nikah of Ayisha Hiba & Muhammed Salah on 16 August 2026.";



window.open(

"https://wa.me/?text="+encodeURIComponent(msg)

);


}



</script>
