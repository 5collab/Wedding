<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nikah Invitation | Ayisha Hiba & Muhammed Salah</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#fdf7f2,#fffaf5);
      color:#444;
      overflow-x:hidden;
    }

    section{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
      padding:40px 20px;
      position:relative;
    }

    h1,h2,h3{
      font-family:'Cinzel',serif;
      color:#8b6b3f;
    }

    .hero{
      background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.75)),
      url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80');
      background-size:cover;
      background-position:center;
    }

    .hero h1{
      font-size:3.2rem;
      margin-bottom:15px;
      animation:fadeDown 1.5s;
    }

    .hero h2{
      font-size:1.5rem;
      font-weight:400;
      margin-bottom:20px;
      animation:fadeUp 2s;
    }

    .hero p{
      max-width:700px;
      line-height:1.8;
      animation:fadeUp 2.5s;
    }

    .gold-line{
      width:120px;
      height:3px;
      background:#c8a96a;
      margin:25px auto;
      border-radius:5px;
    }

    .card{
      background:white;
      padding:35px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      max-width:800px;
      width:95%;
    }

    .names{
      font-size:2.4rem;
      margin:20px 0;
      color:#8b6b3f;
    }

    .parents{
      margin-top:20px;
      line-height:2;
      font-size:1.05rem;
    }

    .date-box{
      background:#f7f1e8;
      padding:25px;
      border-radius:15px;
      margin-top:25px;
    }

    .countdown{
      display:flex;
      gap:15px;
      flex-wrap:wrap;
      justify-content:center;
      margin-top:30px;
    }

    .time{
      background:#8b6b3f;
      color:white;
      padding:20px;
      border-radius:15px;
      min-width:90px;
    }

    .time span{
      display:block;
      font-size:2rem;
      font-weight:bold;
    }

    @keyframes fadeDown{
      from{opacity:0;transform:translateY(-40px);}
      to{opacity:1;transform:translateY(0);}
    }

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(40px);}
      to{opacity:1;transform:translateY(0);}
    }
  </style>
</head>
<body>
