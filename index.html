<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayisha Hiba & Muhammed Salah | Nikah</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Georgia", serif;
}

body{
    background:linear-gradient(135deg,#fff1f7,#ffe4ec);
    color:#4a2635;
    overflow-x:hidden;
}

/* Hero Section */

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    animation:fadeIn 2s;
}

.container{
    width:100%;
    max-width:600px;
}

h1{
    font-size:38px;
    color:#b76e79;
    animation:slideDown 2s;
}

.names{
    margin-top:15px;
    font-size:25px;
    color:#7b3f52;
}

.quote{
    margin-top:20px;
    font-size:18px;
    line-height:1.6;
}

/* Boxes */

.box{
    background:white;
    margin:25px auto;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
    animation:up 1.5s;
}

.box h2{
    color:#b76e79;
    margin-bottom:15px;
}


/* Countdown */

.countdown{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.time{
    background:#b76e79;
    color:white;
    padding:15px;
    border-radius:15px;
    min-width:75px;
}

.time span{
    display:block;
    font-size:25px;
    font-weight:bold;
}


/* Nikah Details */

.details p{
    font-size:18px;
    margin:10px;
}


/* Button */

.music-btn{
    background:#b76e79;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
}


/* Animations */

@keyframes fadeIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

@keyframes slideDown{
    from{
        transform:translateY(-50px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

@keyframes up{
    from{
        transform:translateY(40px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}


</style>

</head>

<body>

<section class="hero">

<div class="container">

<h1>بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</h1>

<div class="names">
    Ayisha Hiba ❤️<br>
    &<br>
    Muhammed Salah
</div>

<p class="quote">
"Two souls, one heart and a beautiful journey begins..."
</p>


<!-- Countdown Box -->

<div class="box">

<h2>Countdown</h2>

<div class="countdown">

<div class="time">
<span id="days">00</span>
Days
</div>

<div class="time">
<span id="hours">00</span>
Hours
</div>

<div class="time">
<span id="minutes">00</span>
Minutes
</div>

<div class="time">
<span id="seconds">00</span>
Seconds
</div>

</div>

</div>
<!-- MUSIC SECTION -->
<div class="music-box">
<h2>🎵 Our Special Song</h2>

<audio controls autoplay loop>
<source src="song.mp3" type="audio/mpeg">
</audio>

</div>


<!-- COUNTDOWN SECTION -->
<div class="countdown-box">

<h2>⏳ Countdown</h2>

<div id="countdown"></div>

</div>


<!-- NIKAH DETAILS -->
<div class="details-box">

<h2>💍 Nikah Details</h2>

<p>
📅 Date: 25 December 2026
</p>

<p>
⏰ Time: 12:00 PM
</p>

<p>
📍 Venue: Your Venue Name
</p>

</div>


<!-- ANIMATION SCRIPT -->
<script>

let nikahDate = new Date("December 25, 2026 12:00:00").getTime();

let timer = setInterval(function(){

let now = new Date().getTime();

let distance = nikahDate - now;


let days = Math.floor(distance/(1000*60*60*24));

let hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));

let minutes = Math.floor((distance%(1000*60*60))/(1000*60));

let seconds = Math.floor((distance%(1000*60))/1000);


document.getElementById("countdown").innerHTML =
days+" Days "+hours+" Hours "+minutes+" Minutes "+seconds+" Seconds";


},1000);

</script>


</body>
</html>
